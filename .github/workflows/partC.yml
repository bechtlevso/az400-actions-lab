name: Part C - broken handoff
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "compiled-output-v1" > app.txt
      - uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app.txt

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-build
      - run: cat app.txt
